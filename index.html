<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水耕栽培管理システム</title>
    <link rel="icon" href="https://em-content.zobj.net/source/apple/391/seedling_1f331.png" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="水耕栽培">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/391/seedling_1f331.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0e1117; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="appFrame" src="https://sanchu-app-diq3gyfsasmmgvax3axxwp.streamlit.app/?embed=true"></iframe>

    <script>
        // URLやストレージを通じてセッション維持と自動スリープ解除を管理
        const iframe = document.getElementById('appFrame');
        
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'SET_USER') {
                localStorage.setItem('sanchu_user', e.data.username);
            } else if (e.data && e.data.type === 'CLEAR_USER') {
                localStorage.removeItem('sanchu_user');
            }
        });

        iframe.onload = function() {
            const savedUser = localStorage.getItem('sanchu_user');
            if (savedUser && !iframe.src.includes('u=')) {
                iframe.src = "https://sanchu-app-diq3gyfsasmmgvax3axxwp.streamlit.app/?embed=true&u=" + encodeURIComponent(savedUser);
            }
        };
    </script>
</body>
</html>
